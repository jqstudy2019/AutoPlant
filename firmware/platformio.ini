; AutoPlant planter node — ESP32-CAM (AI-Thinker)
; Build:  pio run        Flash: pio run -t upload       Monitor: pio device monitor
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
build_flags =
    -DNODE_ID=1
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    adafruit/Adafruit seesaw Library        ; STEMMA I2C soil sensor
    adafruit/Adafruit BME280 Library
    bblanchon/ArduinoJson@^7

; Host-side unit tests for pure logic (pio test -e native)
[env:native]
platform = native
test_filter = test_pump_logic
